          java -cp build/v19-field-numerics FieldGameNumericsSmoke
      - name: Compile and package NeoForge mod
        run: gradle --no-daemon --stacktrace build
      - uses: actions/upload-artifact@v4
        with:
          name: gugugaga-nightwatch-jar
          path: build/libs/*.jar
          if-no-files-found: error

  dedicated-server-smoke:
    name: Actual NeoForge v0.10 dedicated-server startup
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Launch and validate real NeoForge server
        env:
          GUGU_BOOT_TIMEOUT: "420"
          GUGU_FIELD_SELFTEST: "1"
        run: python3 qa/smoke_server_boot.py
      - name: Upload diagnostic server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gugugaga-v010-server-startup
          path: |
            build/server-runtime-smoke.log
            runs/server/logs/latest.log
            runs/server/crash-reports/*.txt
          if-no-files-found: warn

  pathogen-world-disk-restart:
    name: True two-process NeoForge world SavedData restart
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Boot ephemeral world, save to disk, stop, and boot same world
        env:
          GUGU_DISK_STAGE_TIMEOUT: "480"
        run: python3 qa/smoke_pathogen_disk_restart.py
      - name: Upload real disk-restart logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gugugaga-field-disk-restart
          path: |
            build/field-disk-*.log
          if-no-files-found: warn

  client-startup-smoke:
    name: Actual v0.10 graphical client + three native renderer registrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Install virtual display with Mesa software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libgl1
      - name: Actually launch Minecraft 1.21.1 CLIENT and verify native renderers
        env:
          GUGU_CLIENT_TIMEOUT: "420"
        run: python3 qa/smoke_client_boot.py
      - name: Preserve client logs on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gugugaga-v010-real-client-boot
          path: |
            build/client-runtime-smoke.log
            runs/client/logs/latest.log
            runs/client/crash-reports/*.txt
            run/logs/latest.log
          if-no-files-found: warn
