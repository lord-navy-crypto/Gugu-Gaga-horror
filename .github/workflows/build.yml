            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/EcologyExtensionToyField.java \
            qa/java/EcologyExtendedTaxaSmoke.java \
            qa/java/EcologyExtensionToyFieldSmoke.java
          java -cp build/ecology-taxonomy-extra EcologyExtendedTaxaSmoke
          java -cp build/ecology-taxonomy-extra EcologyExtensionToyFieldSmoke
      - name: Verify five curated host-aware ecology profiles and game-only states (Java21)
        run: |
          mkdir -p build/focus-five-observer
          javac -d build/focus-five-observer \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/PathogenRoster15.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/PathogenRoutePolicy15.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/PathogenSpatialFieldMath.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/VanillaHostMapping15.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/EcologyExtendedTaxa.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/FocusFiveProfiles.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/FocusFiveReadout.java \
            qa/java/FocusFiveSmoke.java
          java -cp build/focus-five-observer FocusFiveSmoke
      - name: Source-verified One Health evidence and bounded Minecraft survey model (Java21)
        run: |
          mkdir -p build/one-health-science
          javac -encoding UTF-8 -d build/one-health-science \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/PathogenRoster15.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/PathogenRoutePolicy15.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/PathogenSpatialFieldMath.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/VanillaHostMapping15.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/EcologyExtendedTaxa.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/FocusFiveProfiles.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/OneHealthEvidence5.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/OneHealthObservation.java \
            qa/java/OneHealthEvidence5Smoke.java
          java -cp build/one-health-science OneHealthEvidence5Smoke
      - name: Verify measured Minecraft habitat and reversible crop gameplay (Java21)
        run: |
          mkdir -p build/vanilla-ecology-habitat
          javac -encoding UTF-8 -d build/vanilla-ecology-habitat \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/PathogenRoster15.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/PathogenRoutePolicy15.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/PathogenSpatialFieldMath.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/MinecraftHabitatScience.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/VanillaCropGameFeedback.java \
            qa/java/MinecraftHabitatScienceSmoke.java
          java -cp build/vanilla-ecology-habitat MinecraftHabitatScienceSmoke
      - name: Test read-only 23-label game field sampling and per-player particle ceilings (Java21)
        run: |
          mkdir -p build/game-field-particle-projection
          javac -encoding UTF-8 -d build/game-field-particle-projection \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/PathogenRoster15.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/PathogenRoutePolicy15.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/PathogenSpatialFieldMath.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/EcologyExtendedTaxa.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/FieldParticleSampling.java \
            qa/java/FieldParticleSamplingSmoke.java
          java -cp build/game-field-particle-projection FieldParticleSamplingSmoke
      - name: Validate conserved symbolic spatial waves, deterministic updates and hard resource caps (Java21)
        run: |
          mkdir -p build/game-field-mass-balance
          javac -encoding UTF-8 -d build/game-field-mass-balance \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/PathogenRoster15.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/PathogenRoutePolicy15.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/PathogenSpatialFieldMath.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/PathogenRouteFairScheduler.java \
