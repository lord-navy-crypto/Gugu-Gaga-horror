            qa/java/ViralGameSignalsSmoke.java \
            qa/java/ViralGameSignalWaveSmoke.java \
            qa/java/FieldMassBalanceSmoke.java
          java -cp build/game-field-mass-balance ViralGameSignalsSmoke
          java -cp build/game-field-mass-balance ViralGameSignalWaveSmoke
          java -cp build/game-field-mass-balance FieldMassBalanceSmoke
      - name: Verify V17 surface projection and 200-player cosmetic viewer fairness (Java21)
        run: |
          mkdir -p build/v17-particle-view
          javac -encoding UTF-8 -d build/v17-particle-view \
            src/main/java/io/github/lordnavycrypto/gugugaga/pathogens/FieldParticleViewPolicy.java \
            qa/java/FieldParticleViewPolicySmoke.java
          java -cp build/v17-particle-view FieldParticleViewPolicySmoke
      - name: V19 Minecraft environmental observation and missing-data policy (Java21)
        run: |
          mkdir -p build/v19-minecraft-environment
          javac -encoding UTF-8 -d build/v19-minecraft-environment \
